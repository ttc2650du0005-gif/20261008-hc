<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <title>名言集</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="wrapper">
        <h1>サンリオ 名言集</h1>
        <div class="left-box">
            <figure>
                <img src="meigen/images/jobz.png" alt="スティーブ・ジョブズ" width="470" height="470">
                <figcaption>マイメロディ</figcaption>
            </figure>
            <p>「甘いものは、世界を平和にするのよ。」</p>
        </div>

        <div class="right-box">
            <figure>
                <img src="meigen/images/getes.png" alt="ビル・ゲイツ" width="470" height="400">
            <figcaption>シナモロール</figcaption>
            </figure>
            <p>「キミのそばにいるよ。」</p>

        </div>

        <div class="center-box">
            <figure>
                <img src="meigen/images/migi.png" alt="ミギー" width="430" height="400">
            <figcaption>ぐでたま</figcaption>
            </figure>
            <p>「明日から本気出す」</p>

        </div>
    </div>
</body>
</html>
